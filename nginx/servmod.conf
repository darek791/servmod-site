# ServMod website + update feed (static). Full TLS config (certificate issued by certbot).
server {
    listen 80;
    listen [::]:80;
    server_name servmod.com www.servmod.com;
    return 301 https://servmod.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.servmod.com;
    ssl_certificate /etc/letsencrypt/live/servmod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servmod.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://servmod.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name servmod.com;
    ssl_certificate /etc/letsencrypt/live/servmod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servmod.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/servmod;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # real client IP from Cloudflare (for API rate limits)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(woff2|png|ico)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; add_header X-Content-Type-Options nosniff always; }
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff always; }

    # DOWNLOADS LOCKED until the site is finished: the whole feed/APK path is closed.
    # To release: delete this block, run deploy_site.ps1, then release.py.
    location ^~ /servmod/ { return 404; }

    # (active after unlock)
    # location = /servmod/version.json { add_header Cache-Control "no-store" always; }
    # location = /servmod/history.json { add_header Cache-Control "no-store" always; }
    # location /servmod/releases/ { types { application/vnd.android.package-archive apk; } add_header Cache-Control "public, max-age=3600" always; }
}
